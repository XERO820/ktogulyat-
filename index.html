<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кто идёт гулять?</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at 20% 0%, #1e3a5f, #0b1220 60%);
    color: #e6edf6;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }

  #app { width: 100%; max-width: 560px; }

  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 18px;
    padding: 26px 22px;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    animation: fade .35s ease;
  }

  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  h1 { margin: 0 0 18px; font-size: 24px; text-align: center; }

  /* ---------- вкладки ---------- */
  .tabs {
    display: flex;
    background: rgba(0,0,0,0.25);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: #94a3b8;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
  }
  .tab.active { background: #2563eb; color: #fff; }

  /* ---------- форма ---------- */
  label {
    display: block;
    font-size: 13px;
    color: #9fb0c7;
    margin: 14px 0 6px;
  }
  .hint { font-size: 12px; color: #64748b; margin-top: 5px; }

  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 11px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(0,0,0,0.3);
    color: #fff;
    font-size: 16px;
    outline: none;
    transition: .2s;
  }
  input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.25); }

  .btn {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: 0;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
  }
  .btn.primary { background: #2563eb; color: #fff; }
  .btn.primary:hover { background: #1d4ed8; }

  .msg {
    margin-top: 14px;
    font-size: 14px;
    min-height: 18px;
    color: #f87171;
    text-align: center;
  }
  .msg.ok { color: #4ade80; }

  /* ---------- главный экран ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .hello { font-size: 15px; color: #9fb0c7; }
  .hello b { color: #fff; }

  .logout {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: #cbd5e1;
    padding: 7px 13px;
    border-radius: 9px;
    font-size: 13px;
    cursor: pointer;
  }
  .logout:hover { background: rgba(255,255,255,0.15); }

  .question {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    margin: 6px 0 16px;
  }

  .choices { display: flex; flex-direction: column; gap: 9px; }
  .choice {
    padding: 13px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04);
    color: #cbd5e1;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: .18s;
    text-align: left;
  }
  .choice:hover { background: rgba(255,255,255,0.1); }
  .choice.active.yes     { background: #16a34a; border-color: #16a34a; color: #fff; }
  .choice.active.pending { background: #ca8a04; border-color: #ca8a04; color: #fff; }
  .choice.active.no      { background: #dc2626; border-color: #dc2626; color: #fff; }

  .stats {
    display: flex;
    gap: 8px;
    margin: 22px 0 12px;
    font-size: 13px;
  }
  .stat {
    flex: 1;
    text-align: center;
    padding: 9px 4px;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.07);
  }
  .stat b { display: block; font-size: 18px; margin-bottom: 2px; }
  .stat.green b { color: #4ade80; }
  .stat.red   b { color: #f87171; }
  .stat.gray  b { color: #cbd5e1; }

  .list-title { font-size: 14px; color: #9fb0c7; margin: 18px 0 10px; }

  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li.user {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 13px;
    border-radius: 12px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.07);
  }
  .avatar {
    width: 38px; height: 38px; flex: 0 0 38px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 700; font-size: 16px;
    background: #1e40af; color: #fff;
    text-transform: uppercase;
  }
  .u-info { flex: 1; min-width: 0; }
  .u-name { font-weight: 600; font-size: 15px; }
  .u-name .you { font-size: 12px; color: #60a5fa; font-weight: 500; }
  .u-status { font-size: 13px; margin-top: 2px; }
  .u-status.yes     { color: #4ade80; }
  .u-status.no      { color: #f87171; }
  .u-status.pending { color: #facc15; }

  .empty { text-align: center; color: #64748b; font-size: 14px; padding: 20px 0; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   ХРАНИЛИЩЕ (localStorage)
   ============================================================ */
const USERS_KEY   = 'walk_users_v1';
const CURRENT_KEY = 'walk_current_v1';

function getUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY)) || []; }
  catch (e) { return []; }
}
function saveUsers(users) {
  localStorage.setItem(USERS_KEY, JSON.stringify(users));
}
function getCurrent() { return localStorage.getItem(CURRENT_KEY); }
function setCurrent(name) {
  if (name) localStorage.setItem(CURRENT_KEY, name);
  else localStorage.removeItem(CURRENT_KEY);
}

/* ============================================================
   ПРАВИЛА ПРОВЕРКИ
   ============================================================ */
// Имя: только русские буквы, 2–20 символов
const NAME_RE = /^[А-Яа-яЁё]{2,20}$/;

// Пароль: 4–32 символа, только русские/английские буквы и цифры,
//         и обязательно хотя бы одна цифра
const PASS_RE = /^(?=.*[0-9])[A-Za-zА-Яа-яЁё0-9]{4,32}$/;

const STATUS_TEXT = {
  yes:     '✅ Пойдёт гулять',
  pending: '⏳ Ещё не выбрал',
  no:      '❌ Не пойдёт гулять'
};

const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* ============================================================
   РОУТЕР
   ============================================================ */
function render() {
  const app = document.getElementById('app');
  const current = getCurrent();

  if (!current || !getUsers().some(u => u.name === current)) {
    setCurrent(null);
    renderAuth(app);
  } else {
    renderMain(app, current);
  }
}

/* ============================================================
   ЭКРАН ВХОДА / РЕГИСТРАЦИИ
   ============================================================ */
function renderAuth(app) {
  app.innerHTML = `
    <div class="card">
      <h1>🚶 Кто идёт гулять?</h1>

      <div class="tabs">
        <button class="tab active" data-tab="login">Вход</button>
        <button class="tab" data-tab="register">Регистрация</button>
      </div>

      <form id="authForm" autocomplete="off" novalidate>
        <label for="nameInput">Имя</label>
        <input id="nameInput" type="text" placeholder="Например: Иван" autocomplete="off">
        <div class="hint">Только русские буквы, 2–20 символов</div>

        <label for="passInput">Пароль</label>
        <input id="passInput" type="password" placeholder="Например: Гулять2024" autocomplete="off">
        <div class="hint">Буквы (русские или английские) и цифры, минимум одна цифра</div>

        <div class="msg" id="msg"></div>
        <button type="submit" class="btn primary" id="submitBtn">Войти</button>
      </form>
    </div>
  `;

  let mode = 'login';
  const form    = document.getElementById('authForm');
  const nameIn  = document.getElementById('nameInput');
  const passIn  = document.getElementById('passInput');
  const msg     = document.getElementById('msg');
  const submit  = document.getElementById('submitBtn');
  const tabs    = app.querySelectorAll('.tab');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      mode = tab.dataset.tab;
      tabs.forEach(t => t.classList.toggle('active', t === tab));
      submit.textContent = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
      msg.textContent = '';
      msg.className = 'msg';
      passIn.value = '';
    });
  });

  function showError(text) {
    msg.textContent = text;
    msg.className = 'msg';
  }

  form.addEventListener('submit', e => {
    e.preventDefault();

    const name = nameIn.value.trim();
    const pass = passIn.value;

    // --- проверка имени ---
    if (!NAME_RE.test(name)) {
      showError('Имя: только русские буквы, от 2 до 20 символов, без пробелов, цифр и знаков.');
      return;
    }

    // --- проверка пароля ---
    if (!PASS_RE.test(pass)) {
      showError('Пароль: 4–32 символа, только буквы и цифры, и хотя бы одна цифра.');
      return;
    }

    const users = getUsers();

    if (mode === 'register') {
      if (users.some(u => u.name.toLowerCase() === name.toLowerCase())) {
        showError('Такое имя уже занято, попробуй другое.');
        return;
      }
      users.push({ name, password: pass, status: 'pending' });
      saveUsers(users);
      setCurrent(name);
      render();
    } else {
      const user = users.find(u => u.name.toLowerCase() === name.toLowerCase());
      if (!user || user.password !== pass) {
        showError('Неверное имя или пароль.');
        return;
      }
      setCurrent(user.name);
      render();
    }
  });
}

/* ============================================================
   ГЛАВНЫЙ ЭКРАН
   ============================================================ */
function renderMain(app, current) {
  const users = getUsers();
  const me = users.find(u => u.name === current);

  const order = { yes: 0, pending: 1, no: 2 };
  const sorted = [...users].sort((a, b) =>
    (order[a.status] - order[b.status]) || a.name.localeCompare(b.name, 'ru')
  );

  const countYes     = users.filter(u => u.status === 'yes').length;
  const countNo      = users.filter(u => u.status === 'no').length;
  const countPending = users.filter(u => u.status === 'pending').length;

  const listHTML = sorted.map(u => `
    <li class="user">
      <div class="avatar">${esc(u.name[0])}</div>
      <div class="u-info">
        <div class="u-name">${esc(u.name)}${u.name === current ? ' <span class="you">(вы)</span>' : ''}</div>
        <div class="u-status ${u.status}">${STATUS_TEXT[u.status]}</div>
      </div>
    </li>
  `).join('');

  app.innerHTML = `
    <div class="card">
      <div class="topbar">
        <div class="hello">Привет, <b>${esc(me.name)}</b>!</div>
        <button class="logout" id="logoutBtn">Выйти</button>
      </div>

      <div class="question">Кто выйдет гулять?</div>

      <div class="choices">
        <button class="choice yes ${me.status === 'yes' ? 'active' : ''}"     data-status="yes">✅ Да, пойду гулять</button>
        <button class="choice pending ${me.status === 'pending' ? 'active' : ''}" data-status="pending">⏳ Ещё не выбрал</button>
        <button class="choice no ${me.status === 'no' ? 'active' : ''}"       data-status="no">❌ Нет, не пойду</button>
      </div>

      <div class="stats">
        <div class="stat green"><b>${countYes}</b>идут</div>
        <div class="stat gray"><b>${countPending}</b>не решили</div>
        <div class="stat red"><b>${countNo}</b>не идут</div>
      </div>

      <div class="list-title">Зарегистрированные друзья (${users.length}):</div>
      <ul class="list">${listHTML || '<div class="empty">Пока никого нет</div>'}</ul>
    </div>
  `;

  // выбор ответа
  app.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => {
      const users = getUsers();
      const user = users.find(u => u.name === current);
      if (!user) return;
      user.status = btn.dataset.status;
      saveUsers(users);
      render();
    });
  });

  // выход
  document.getElementById('logoutBtn').addEventListener('click', () => {
    setCurrent(null);
    render();
  });
}

/* ============================================================ */
render();
</script>
</body>
</html>
